spring.application.name=user-service

# Supabase PostgreSQL Connection (secrets come from environment variables / .env file)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.hwzcsgsjqftamjxvtbrf}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# Disable prepared statements - required for Supabase transaction-mode pooler (port 6543)
spring.datasource.hikari.connection-init-sql=select 1
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false
