spring.application.name=inventory-service

# Read DB_URL / DB_USERNAME / DB_PASSWORD from the .env file next to pom.xml.
# Spring Boot does NOT load .env on its own - this line is what makes it happen.
spring.config.import=optional:file:.env[.properties]

# Supabase PostgreSQL Connection (secrets come from environment variables / .env file)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DB_USERNAME:postgres.hwzcsgsjqftamjxvtbrf}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Supabase transaction-mode pooler (port 6543) multiplexes connections, so server-side prepared
# statements collide ("prepared statement S_1 already exists"). The fix is prepareThreshold=0 on
# the JDBC URL above.
spring.jpa.properties.hibernate.jdbc.use_streams_for_binary=false

# Inventory Service owns its own PostgreSQL schema (separate from the other services).
spring.jpa.properties.hibernate.default_schema=inventory_service
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
server.port=8082
